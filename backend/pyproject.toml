[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptb-api"
version = "3.0.2"
description = "Shared local and server API scaffold for PhoneticToolbox"
requires-python = ">=3.11,<3.12"
dependencies = ["phonetic-core==3.0.2", "fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.52.4", "argon2-cffi==25.1.0", "psycopg[binary]==3.3.3", "itsdangerous==2.2.0"]

[project.optional-dependencies]
feedback = ["Pillow==12.3.0"]
synthesis-io = ["phonetic-core[synthesis]==3.0.2", "soundfile==0.13.1"]
acoustic-io = ["phonetic-core[acoustic]==3.0.2", "openpyxl==3.1.5", "et-xmlfile==2.0.0"]

[project.scripts]
ptb-api = "ptb_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptb_worker = ["assets/*.ttf", "assets/*.txt"]
