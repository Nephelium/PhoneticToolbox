# HTTP-level maps. Only the designated server enables the anonymous log.
map $uri $ptb_stats_kind {
    default "";
    / page;
    /index.html page;
    /api/v1/workspaces/open web;
    ~^/releases/windows-x64/[^/]+/PhoneticToolbox-windows-x64\.exe$ portable;
    ~^/releases/windows-x64/[^/]+/PhoneticToolbox-[^/]+-windows-x64-setup\.exe$ installer;
    ~^/releases/macos-arm64/[^/]+/PhoneticToolbox-[^/]+-macos[^/]+\.zip$ macos;
}
map $http_user_agent $ptb_stats_bot {
    default 0;
    ~*(bot|crawler|spider|slurp|headless|PTB-Website-Verify) 1;
}
map "$request_method:$status:$ptb_stats_kind:$ptb_stats_bot:$upstream_http_x_ptb_web_use" $ptb_stats_loggable {
    default 0;
    ~^GET:200:page:0: 1;
    ~^GET:(200|206):(portable|installer|macos):0: 1;
    "POST:200:web:0:1" 1;
}
log_format ptb_website_stats escape=json
    '{"id":"$request_id","time":"$time_iso8601","kind":"$ptb_stats_kind",'
    '"method":"$request_method","status":$status,"range":"$http_range","bytes":$body_bytes_sent,"webUse":"$upstream_http_x_ptb_web_use"}';
