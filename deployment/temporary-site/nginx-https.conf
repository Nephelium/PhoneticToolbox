# Static placeholder only. Keep ACME HTTP validation available for renewal.
server {
    listen 80;
    listen [::]:80;
    server_name www.phonetictoolbox.com phonetictoolbox.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.phonetictoolbox.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name phonetictoolbox.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/phonetictoolbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phonetictoolbox.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PTBStaticTLS:10m;
    ssl_session_timeout 1d;

    return 301 https://www.phonetictoolbox.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.phonetictoolbox.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/phonetictoolbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phonetictoolbox.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PTBStaticTLS:10m;
    ssl_session_timeout 1d;

    root /var/www/phonetictoolbox-coming-soon;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
