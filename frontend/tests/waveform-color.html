<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>P19-R4 synthetic display fixture</title></head><body><div id="app"></div>
<div class="analysis"><button data-analysis="acoustics">声学</button><button data-analysis="monitor">监视</button><button id="stopFrames" disabled>停止</button><div id="monitorHome"><section id="monitorPanel"><button id="monitorCollapse">折叠</button><button id="monitorExpand">展开</button><button id="monitorStop">停止</button><select id="monitorSeconds"><option value="2">2</option></select><select id="monitorWindow"><option value="25">25</option></select><select id="monitorHop"><option value="5">5</option></select><span id="monitorStatus"></span><canvas id="waveCanvas" style="width:640px;height:160px"></canvas><canvas id="spectrogramCanvas" style="width:640px;height:160px"></canvas></section></div></div><dialog id="monitorDialog"><button id="monitorClose">关闭</button><div class="monitor-dialog-body"></div></dialog>
<script type="module">
import {createApp,h,reactive,markRaw} from 'vue';
import Wave from '../src/components/WaveformViewport.vue';
import Recording from '../src/modules/recording/RecordingWave.vue';
import Plot from '../src/components/ScientificPlot.vue';
import {inversePanels} from '../src/modules/egg-analysis/inverse-plots.ts';
import {installWaveformAppearance,setWaveformAppearance} from '../src/state/waveform-color.ts';
import {scientificPlotsSvg,scientificPlotsPng} from '../src/design/plot-export.ts';
import {wholeFigureSvg,wholeFigurePng} from '../src/modules/parameter-display/export.ts';
import '../src/design/tokens.css';
// Synthetic geometry only. No task, device, database or scientific computation.
installWaveformAppearance();
const samples=Float32Array.from({length:8000},(_,i)=>.7*Math.sin(i*.08));
const wave=reactive({asset:markRaw({name:'synthetic.wav',sampleRate:8000,duration:1,channels:[samples]}),start:.1,end:.3,channel:0,zoom:1,offset:0,parameters:[],dirty:false,error:'',loading:false});
const bins=Array.from({length:120},(_,i)=>[-.7*Math.abs(Math.sin(i*.2)),.7*Math.abs(Math.sin(i*.2))]);
const data={relative_times_s:[-.025,-.01,0,.01,.025],frequencies_hz:[0,100,200,500,1000],audio_values:[0,.3,-.8,.5,0],egg_values:[0,.8,0,-.5,0],inverse_values:[0,-.1,.8,-.7,0],audio_db:[-40,-20,-10,-20,-40],egg_db:[-40,-15,-5,-15,-40],inverse_db:[-35,-25,-15,-25,-35]};
const panels=inversePanels(data,'combined');
createApp({render:()=>h('main',{style:'max-width:1200px;margin:auto'},[
 h('section',{id:'common'},[h(Wave,{state:wave})]),
 h('section',{id:'recording',style:'height:300px'},[h(Recording,{preview:{wave:[bins],start_frame:0,window_frames:8000,sample_rate:8000},selection:[0,0],roles:['audio'],spectrum:false,disabled:false,scale:1})]),
 ...panels.map(p=>h('section',{class:'export-panel',id:p.id},[h('h3',p.title),h(Plot,{...p,title:p.title})]))
])}).mount('#app');
const monitorColors=[];const original=CanvasRenderingContext2D.prototype.stroke;
CanvasRenderingContext2D.prototype.stroke=function(...args){if(this.canvas.id==='waveCanvas')monitorColors.push(this.strokeStyle);return original.apply(this,args);};
// Public M10 modules run directly in the browser, as in the production iframe.
await new Promise((resolve,reject)=>{window.monitorModuleReady=resolve;const script=document.createElement('script');script.type='module';script.textContent="import {setupMonitor} from '/vocal-tract/monitor.js';window.qaSetupMonitor=setupMonitor;window.monitorModuleReady();";script.onerror=reject;document.body.append(script);});
window.qaSetupMonitor(async()=>({json:async()=>({generation:1,end:2,seconds:2,duration:1,window_ms:25,hop_seconds:.005,resolution_hz:40,waveform:bins,spectrogram:[]})}),()=>false);
document.querySelector('[data-analysis=monitor]').click();
window.qa={set:setWaveformAppearance,monitorColors,redraw:()=>document.dispatchEvent(new Event('m10-theme')),
 scientific:()=>scientificPlotsSvg([...document.querySelectorAll('.export-panel')]),
 scientificPng:()=>scientificPlotsPng([...document.querySelectorAll('.export-panel')]),
 whole:()=>{const chart=document.querySelector('.scientific-plot>svg');return {chart,waveform:document.querySelector('#common'),title:'合成示例',start:0,end:1,plotLeft:60,plotRight:chart.viewBox.baseVal.width-40};},
 wholeSvg:()=>wholeFigureSvg(window.qa.whole()),wholePng:()=>wholeFigurePng(window.qa.whole())};
</script></body></html>
