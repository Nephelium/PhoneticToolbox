[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phonetic-core"
version = "3.0.0a1"
description = "PhoneticToolbox scientific core; M01 array algorithms and explicit backend ports"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
acoustic = ["numpy==2.2.6", "scipy==1.16.3", "praat-parselmouth==0.4.7", "pandas==2.3.3"]
synthesis = ["numpy==2.2.6", "scipy==1.16.3", "praat-parselmouth==0.4.7", "pandas==2.3.3"]
resynthesis = ["numpy==2.2.6", "scipy==1.16.3", "praat-parselmouth==0.4.7", "pandas==2.3.3", "pyworld==0.3.5"]
lpc = ["numpy==2.2.6", "scipy==1.16.3"]
egg = ["numpy==2.2.6", "scipy==1.16.3", "praat-parselmouth==0.4.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phonetic_core.acoustic" = ["data/*.mat", "NOTICE.txt", "licenses/*"]
"phonetic_core.egg" = ["NOTICE.txt"]

"phonetic_core.lpc" = ["NOTICE.txt"]
"phonetic_core.synthesis.klatt" = ["LICENSE", "NOTICE.md", "presets.json"]
