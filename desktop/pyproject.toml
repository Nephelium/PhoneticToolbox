[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptb-desktop"
version = "3.0.0a1"
description = "PhoneticToolbox local service launcher; full window pending P04"
requires-python = ">=3.11,<3.12"
dependencies = ["phonetic-core==3.0.0a1"]

[project.optional-dependencies]
host = ["PyQt6==6.11.0", "PyQt6-WebEngine==6.11.0", "PyQt6-Qt6==6.11.2", "PyQt6-WebEngine-Qt6==6.11.2"]

[project.scripts]
ptb-desktop-check = "ptb_desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]
