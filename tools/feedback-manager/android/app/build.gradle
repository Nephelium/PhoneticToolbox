plugins { id 'com.android.application' }
android {
    namespace 'com.phonetictoolbox.feedback'
    compileSdk 35
    defaultConfig { applicationId 'com.phonetictoolbox.feedback'; minSdk 26; targetSdk 35; versionCode 6; versionName '1.1.3' }
    signingConfigs {
        release {
            storeFile file(System.getenv('PTB_FEEDBACK_KEYSTORE'))
            storePassword System.getenv('PTB_FEEDBACK_STORE_PASSWORD')
            keyAlias 'feedback'
            keyPassword System.getenv('PTB_FEEDBACK_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs = [System.getenv('PTB_FEEDBACK_WEB_ROOT') ?: '../../../../output/build-feedback-manager/web']
    buildDir = file('../../../../output/build-feedback-manager/android-app')
}
