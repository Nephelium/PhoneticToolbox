<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发音物理模拟器</title>
    <link rel="stylesheet" href="articulatory_synth.css">
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">PhoneticToolbox</p>
                <h1>发音物理模拟器</h1>
            </div>
            <div class="transport">
                <button id="playToggle" class="primary">开始发声</button>
                <button id="voiceToggle">声带：开</button>
                <button id="nasalToggle">鼻腔：关</button>
                <span id="audioStatus" class="status">等待启动</span>
            </div>
        </header>

        <section class="stage" aria-label="发音器官和声学可视化">
            <section class="panel tract-panel">
                <div class="panel-head">
                    <h2>发音器官</h2>
                    <span id="postureLabel">中性声道</span>
                </div>
                <svg id="tractSvg" viewBox="0 0 720 430" role="img" aria-label="正中矢状面发音器官示意图">
                    <defs>
                        <linearGradient id="tongueGradient" x1="0" x2="1">
                            <stop offset="0" stop-color="#f08f8a"/>
                            <stop offset="1" stop-color="#efc1a6"/>
                        </linearGradient>
                    </defs>
                    <path class="head-fill" d="M89 42 C155 14 316 20 468 48 C572 68 640 142 653 246 C666 347 612 408 514 422 L190 422 C116 418 70 372 64 306 C58 244 68 191 48 142 C34 108 48 61 89 42 Z"/>
                    <path class="neck-fill" d="M515 292 C578 324 609 367 613 430 L450 430 C466 378 488 331 515 292 Z"/>
                    <path class="nasal-cavity" d="M92 93 C153 45 310 42 462 70 C532 83 586 116 615 161 C548 151 492 143 426 139 C308 133 204 145 114 176 C99 150 85 117 92 93 Z"/>
                    <path id="oralCavity" class="oral-cavity" d="M111 211 C213 168 348 152 492 166 C543 171 575 201 577 246 C551 235 515 221 456 215 C332 202 228 218 134 273 C101 257 91 231 111 211 Z"/>
                    <path id="pharynxSpace" class="pharynx-space" d="M536 158 C597 186 622 242 599 304 C585 343 551 380 512 405 C514 347 519 288 542 242 C559 209 555 181 536 158 Z"/>
                    <path class="nasal-floor" d="M126 177 C221 144 339 134 507 153"/>
                    <path id="nasalPath" class="nasal" d="M104 115 C197 76 356 76 506 103 C562 113 599 137 620 166"/>
                    <path id="palatePath" class="palate" d="M137 191 C235 150 401 142 532 169"/>
                    <path id="velumPath" class="velum" d="M532 169 C568 180 589 207 592 246"/>
                    <path id="uvulaPath" class="uvula" d="M572 231 C558 250 558 268 573 286"/>
                    <path id="tonguePath" class="tongue" d="M145 320 C176 280 218 250 278 234 C358 213 467 238 552 344 C444 380 255 378 145 320 Z"/>
                    <path id="jawPath" class="jaw" d="M108 330 C183 397 366 408 512 360"/>
                    <path id="upperLip" class="lip" d="M104 204 C77 188 55 193 42 215 C67 215 89 219 112 232"/>
                    <path id="lowerLip" class="lip" d="M112 252 C86 276 59 279 39 258 C67 252 90 244 113 230"/>
                    <path id="upperTeeth" class="teeth upper-teeth" d="M119 199 L108 239"/>
                    <path id="lowerTeeth" class="teeth lower-teeth" d="M115 249 L105 279"/>
                    <path class="epiglottis" d="M522 315 C548 299 560 315 546 350"/>
                    <path class="larynx" d="M543 349 C527 377 521 395 520 420"/>
                    <path id="airPath" class="air" d="M129 235 C235 194 374 184 510 205 C552 212 573 223 589 241"/>
                    <circle id="glottisDot" class="glottis" cx="538" cy="373" r="9"/>
                    <g id="dragLayer" class="drag-layer" aria-label="可拖动发音器官控制点">
                        <circle class="drag-handle" data-control="upperLip" cx="88" cy="206" r="10"/>
                        <circle class="drag-handle" data-control="lowerLip" cx="88" cy="254" r="10"/>
                        <circle class="drag-handle" data-control="jaw" cx="168" cy="354" r="10"/>
                        <circle class="drag-handle tongue-handle" data-control="tongueTip" cx="218" cy="256" r="11"/>
                        <circle class="drag-handle tongue-handle" data-control="tongueBody" cx="338" cy="224" r="11"/>
                        <circle class="drag-handle tongue-handle" data-control="tongueRoot" cx="500" cy="306" r="11"/>
                        <circle class="drag-handle" data-control="velum" cx="590" cy="228" r="10"/>
                        <circle class="drag-handle" data-control="pharynx" cx="563" cy="248" r="10"/>
                    </g>
                    <text x="34" y="35" class="svg-label">拖动圆点改变发音器官；声道面积函数由姿态实时估计</text>
                </svg>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>声道面积函数</h2>
                    <span id="formantReadout">F1 -- / F2 -- / F3 --</span>
                </div>
                <canvas id="areaCanvas" width="640" height="260"></canvas>
                <div class="meter-row">
                    <div><span>最窄处</span><strong id="constrictionReadout">-- cm²</strong></div>
                    <div><span>唇端面积</span><strong id="lipAreaReadout">-- cm²</strong></div>
                    <div><span>鼻化</span><strong id="nasalReadout">0%</strong></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>输出信号</h2>
                    <span id="engineLabel">AudioWorklet 优先</span>
                </div>
                <canvas id="waveCanvas" width="640" height="120"></canvas>
                <canvas id="spectrumCanvas" width="640" height="180"></canvas>
                <div class="export-row">
                    <button id="exportParams">导出参数 JSON</button>
                    <button id="exportWav">导出最近音频 WAV</button>
                </div>
            </section>
        </section>

        <section class="controls-grid" aria-label="参数控制">
            <section class="panel controls-panel">
                <div class="panel-head">
                    <h2>连续参数</h2>
                    <span>键盘：W/S A/D Q/E R/F N V Space</span>
                </div>
                <div id="sliderBank" class="slider-bank"></div>
            </section>

            <section class="panel presets-panel">
                <div class="panel-head">
                    <h2>姿态预设</h2>
                    <span>用于快速听辨趋势</span>
                </div>
                <div class="preset-grid">
                    <button data-preset="i">[i]</button>
                    <button data-preset="a">[a]</button>
                    <button data-preset="u">[u]</button>
                    <button data-preset="nasal">鼻化元音</button>
                    <button data-preset="fricative">清擦音</button>
                    <button data-preset="voicedFricative">浊擦音</button>
                    <button data-preset="whisper">耳语</button>
                    <button data-preset="neutral">中性</button>
                </div>
                <p class="note">此工具用低维物理近似实时合成声音。它能展示发音姿态与声学趋势的关系，但不能替代三维有限元或真实声道测量。</p>
            </section>
        </section>
    </main>

    <script src="articulatory_synth.js"></script>
</body>
</html>
