[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonetic-toolbox"
version = "2.1.3"
description = "A modular toolkit for phonetic analysis and synthesis"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [
    {name = "PhoneticToolbox Team"}
]
dependencies = [
    "numpy>=1.20.0,<2",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "PyQt6>=6.2.0",
    "pyqtgraph>=0.12.0",
    "praat-parselmouth>=0.4.0",
    "PyWavelets>=1.1.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.10.0",
    "openpyxl>=3.0.0",
    "python-docx>=1.1.0",
    "opencv-contrib-python>=4.8.0,<4.12.0",
    "mediapipe>=0.10.0,<0.10.22",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "mypy>=0.900",
    "flake8>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phonetic_toolbox*"]

[tool.pytest.ini_options]
testpaths = ["phonetic_toolbox/tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=phonetic_toolbox"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
